name: Lean

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-mathlib-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install metadata-check dependencies
        run: python3 -m pip install -r requirements-palomar.txt
      - name: Check Lean proofs, lint, axioms, and paper correspondence
        run: python3 scripts/check.py

  comparator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-mathlib-cache: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24.0'
          cache: false
      - name: Compare the two statements and replay the proofs with NanoDa
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .audit
          scripts/verify-comparator.sh 2>&1 | tee .audit/comparator.log
      - name: Preserve the local comparison log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: comparator-log
          path: .audit/comparator.log
