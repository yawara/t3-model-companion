name = "T3"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["T3", "Solution"]
lintDriver = "batteries/runLinter"
fixedToolchain = true

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
maxSynthPendingDepth = 3
weak.linter.mathlibStandardSet = true
weak.linter.style.header = true
weak.linter.style.longFile = 1500

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "065356127b1dc0016f66b7283ce0ce2c4055aa55"

[[lean_lib]]
name = "T3"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
