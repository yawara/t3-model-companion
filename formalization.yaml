# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: v0.4

project:
  name: Existence of a Model Companion for Groups of Exponent 3
  description: >-
    This project formalizes the existence of a model companion for the
    first-order theory of groups satisfying x^3 = 1. Its principal
    group-theoretic result gives a uniform, explicit bound on the number of
    generators needed to witness a failure of amalgamation with an
    existentially closed exponent-three group. The development follows the
    accompanying manuscript through free groups, associated graded Lie
    algebras, strict extensions, and the bounded-amalgamation criterion.
  authors:
    - Yawara Ishida
  license: Apache-2.0
  responsible_maintainers:
    - Yawara Ishida

classification:
  arxiv: [math.LO, math.GR]
  msc2020: [03C60, 20A15]

sources:
  - title: Existence of a Model Companion for Groups of Exponent 3
    authors:
      - Yawara Ishida
      - Ryosuke Mizuno
      - Kota Takeuchi
    id: T3_modelcompanion_v9.tex
    type: paper
    location: >-
      Theorem 3.3 (TeX label thm:main), Corollary 3.4, and their supporting
      results in Sections 2-5. Conjecture 1.1 is open; the former Section 6
      questions and reduction are retained from the archived v8 source in the paper map.
    relationship: formalizes
    note: >-
      The manuscript is included at the repository root. Its SHA256 is
      d48f10716bcc7963b654c6fe27013ac75eaa9cbdf6593683a0efc513dd062952.
      The source identifier is a repository-relative path; no external
      publication identifier is asserted. This is a source-based
      formalization, not a claim that the Lean development first presents
      the mathematical result.

status:
  scope: >-
    The paper map tracks 57 active v9 items and three retained inactive
    entries from the archived v8 Section 6, removed in v9, with 80 parts in total.
    The active scope contains 56 proved items and the open Conjecture 1.1,
    including every Section 5 result and the universe bridges used to
    interpret the model-theoretic statements. The inactive entries retain
    two open questions and the proved Burnside/local-finiteness equivalence.
    Across both scopes, 57 items and all 80 parts are proved. Per-item proof
    states are recorded in docs/paper-map.toml. Neither the open conjecture
    nor the two questions are asserted as proved. The announcement about
    sufficiently large primes belongs to a separate paper and is outside
    this library's proof scope. The proposed Comparator selection consists
    of Theorem 3.3 and Corollary 3.4 only.
    Local preparation is not a Palomar submission or registration.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
  main_results:
    - declaration: T3.exists_bounded_nonamalgamation_witness
      file: T3/Main/BoundedWitness.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: comparator.json
    - declaration: T3.has_model_companion
      file: T3/Main/ModelCompanion.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: comparator.json

automation:
  methods:
    - method: agent
      models: [GPT-6]
      framework: OpenAI Codex
      tool_setup: >-
        Agent-assisted Lean implementation, source and statement comparison,
        proof adaptation, and verification using Lean, Lake, mathlib linters,
        and project audit scripts, under human direction.
  notes: >-
    AI agents implemented and reviewed the formalization under Yawara
    Ishida's direction. The paper separately discloses an initial proof
    outline generated by ChatGPT (GPT-5.6 Sol), followed by development,
    reconstruction, and proof checking by the paper's authors. That
    manuscript disclosure is not a claim that those authors reviewed the
    Lean implementation. Costs and total historical effort are not asserted.

fidelity:
  divergences: >-
    No changed mathematical hypotheses, weakened bounds, or unproved
    project axioms are intended. The explicit witness bound is
    15 * ((3*m+4) * (m + choose(m,2) + choose(m,3)) + 1)^2.
    Group embeddings represent inclusions; finite generation represents
    finiteness where exponent-three local finiteness makes them equivalent.
    Canonical-universe model-theoretic definitions have proved bridges to
    arbitrary universes. One auxiliary degree-one comparison is proved
    directly by universality and retraction; the principal constructions
    follow the manuscript. These encoding and proof details are tracked in
    docs/paper-map.toml; its fidelity labels record agent review, not a
    machine proof of agreement with natural language.

review:
  status: agent-reviewed
  reviewers:
    - OpenAI Codex agents
  notes: >-
    Agents compared source statements, hypotheses, constants, and principal
    constructions with the Lean development. The v9 migration and its
    source comparison are recorded in notes/v9-migration.md. The received v9
    manuscript is preserved byte-for-byte. Sections 2-5 are identical to v8;
    suggested clarifications remain in review notes and are not applied to the paper.
    The historical v7 source migration and
    the boundary of prior v4 verification are recorded in notes/v7-migration.md.
    Section 5 and the known Section 6 reduction are documented with the new
    verification snapshot in notes/v7-formalization.md; the remaining
    questions are discussed in notes/section-six-analysis.md.
    The additional Section 6 research notes contain unformalized mathematical
    arguments and are outside the Lean proof and Comparator scope.
    The mathematical library has recorded local build, lint, import,
    paper-map, and axiom audits, and the v7 snapshot passed Comparator and
    NanoDa on Lean v4.33.1. Verification after upgrading to Lean and mathlib
    v4.34.0 is recorded, with its precise scope and inputs, in
    notes/palomar-readiness-2026-09-22.md. No
    independent human peer review of the Lean formalization is claimed.
    Comparator, NanoDa, and Palomar review are separate from those existing
    library checks; see docs/palomar.md for the preparation status.

alignment:
  namespace: T3
  statements:
    - source: Theorem 3.3; thm:main; Paper-ID main.bounded_witness
      lean: T3.exists_bounded_nonamalgamation_witness
      module: T3.Main.BoundedWitness
      status: proved
      note: >-
        Both factor-witness cases are proved with the explicit function
        constructed in the paper. The bound depends only on the number of
        generators of B, not on the finite common subgroup A.
    - source: Corollary 3.4; Paper-ID main.model_companion
      lean: T3.has_model_companion
      module: T3.Main.ModelCompanion
      status: proved
      note: >-
        The model companion is obtained from the bounded-amalgamation
        criterion without an additional structural hypothesis.

acknowledgements: >-
  This development uses Lean and mathlib. The repository contains the
  substantive formal proof development. The paper and the formalization
  have distinct authorship lists as recorded above.
